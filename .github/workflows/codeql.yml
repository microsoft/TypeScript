name: CodeQL

on:
  push:
    branches: [main, main-ts7, ts7-release, release-*]
  pull_request:
    branches: [main, main-ts7, ts7-release, release-*]
  schedule:
    - cron: '30 1 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    if: github.repository == 'microsoft/TypeScript'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: ./.github/actions/setup-go
      - run: npm ci
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: go, javascript-typescript
          config-file: ./.github/codeql/codeql-configuration.yml
      - run: npx hereby build
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
