name: Tag vscode-typescript release

on:
  pull_request_target:
    types: [closed]
    branches: [main]
    paths:
      - packages/vscode-typescript/package.json
  workflow_dispatch:

run-name: Tag vscode-typescript release

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  tag:
    if: >-
      github.repository == 'microsoft/TypeScript' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        github.event.pull_request.merged == true
      )
    runs-on: ubuntu-latest
    environment:
      name: azure
      deployment: false

    steps:
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create GitHub App token
        id: app-token
        uses: microsoft/create-github-app-token-via-key-vault@5ba0d436e9c3cac52feff4d1f2f66f9698ce4a2d # v1
        with:
          client-id: ${{ vars.TYPESCRIPT_AUTOMATION_GITHUB_APP_CLIENT_ID }}
          key-id: ${{ vars.TYPESCRIPT_AUTOMATION_GITHUB_APP_KEY_ID }}
          owner: microsoft
          repositories: TypeScript
          permission-contents: write

      - name: Create release tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_COMMIT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const {
              EVENT_NAME,
              DISPATCH_REF,
              DISPATCH_COMMIT_SHA,
              PR_BASE_SHA,
              MERGE_COMMIT_SHA,
            } = process.env;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            if (EVENT_NAME === "workflow_dispatch" && DISPATCH_REF !== "refs/heads/main") {
              throw new Error(`Manual releases must be dispatched from main, got ${DISPATCH_REF}.`);
            }
            const releaseCommit = EVENT_NAME === "workflow_dispatch"
              ? DISPATCH_COMMIT_SHA
              : MERGE_COMMIT_SHA;

            if (!releaseCommit) {
              throw new Error("Could not determine the release commit.");
            }

            const readJson = async (path, ref) => {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref,
              });
              if (Array.isArray(response.data) || response.data.type !== "file") {
                throw new Error(`${path} is not a file.`);
              }
              return JSON.parse(Buffer.from(response.data.content, "base64").toString());
            };

            const packagePath = "packages/vscode-typescript/package.json";
            const packageJson = await readJson(packagePath, releaseCommit);
            const version = packageJson.version;
            if (typeof version !== "string" || !/^\d+\.\d+\.\d+$/.test(version) || version === "0.0.0") {
              throw new Error(`Invalid extension version: ${JSON.stringify(version)}.`);
            }

            if (EVENT_NAME !== "workflow_dispatch") {
              if (!PR_BASE_SHA) {
                throw new Error("Could not determine the pull request base commit.");
              }

              const previousPackageJson = await readJson(packagePath, PR_BASE_SHA);
              if (previousPackageJson.version === version) {
                console.log(`${packagePath} changed without changing its version.`);
                return;
              }
            }

            const packageLock = await readJson("package-lock.json", releaseCommit);
            const lockVersion = packageLock.packages?.["packages/vscode-typescript"]?.version;
            if (lockVersion !== version) {
              throw new Error(`package.json version ${version} does not match package-lock.json version ${lockVersion}.`);
            }

            const tag = `vscode-typescript/v${version}`;
            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });
              throw new Error(`Tag ${tag} already exists.`);
            }
            catch (error) {
              if (error.status !== 404) throw error;
            }

            const annotatedTag = await github.rest.git.createTag({
              owner,
              repo,
              tag,
              message: `vscode-typescript ${version}`,
              object: releaseCommit,
              type: "commit",
              tagger: {
                name: "typescript-automation[bot]",
                email: "290192711+typescript-automation[bot]@users.noreply.github.com",
              },
            });

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tag}`,
              sha: annotatedTag.data.sha,
            });
