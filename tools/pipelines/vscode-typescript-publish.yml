trigger: none

name: vscode-typescript-publish-$(Date:yyyyMMdd)$(Rev:.r)
appendCommitMessageToRunName: false

parameters:
  - name: dryRun
    displayName: Dry run
    type: boolean
    default: false

variables:
  - name: TeamName
    value: TypeScript

resources:
  repositories:
    - repository: MicroBuildTemplate
      type: git
      name: 1ESPipelineTemplates/MicroBuildTemplate
      ref: refs/tags/release
  pipelines:
    - pipeline: VSCode_TypeScript_Release_Build
      project: DevDiv
      source: VSCode TypeScript Release Build
      trigger:
        tags:
          - vscode-typescript-release

extends:
  template: azure-pipelines/MicroBuild.1ES.Official.Publish.yml@MicroBuildTemplate

  parameters:
    sdl:
      sourceAnalysisPool: VSEngSS-MicroBuild2022-1ES
    pool:
      name: AzurePipelines-EO
      image: 1ESPT-Ubuntu22.04
      os: linux
    settings:
      networkIsolationPolicy: Permissive,CFSClean

    stages:
      - stage: Publish
        displayName: Publish vscode-typescript
        jobs:
          - job: Publish
            displayName: Publish vscode-typescript

            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - input: pipelineArtifact
                  pipeline: VSCode_TypeScript_Release_Build
                  artifactName: vsix
                  targetPath: $(Pipeline.Workspace)/vsix

            steps:
              - checkout: none

              - bash: |
                  set -euo pipefail
                  artifactDirectory="$(Pipeline.Workspace)/vsix"
                  manifest="$artifactDirectory/release-manifest.json"
                  test -f "$manifest"

                  extension="$(jq -r '.extension' "$manifest")"
                  version="$(jq -r '.extensionVersion' "$manifest")"
                  bundledTypeScriptVersion="$(jq -r '.bundledTypeScriptVersion' "$manifest")"
                  signType="$(jq -r '.signType' "$manifest")"
                  sourceRef="$(jq -r '.sourceRef' "$manifest")"
                  sourceCommit="$(jq -r '.sourceCommit' "$manifest")"
                  if [ "$extension" != "TypeScriptTeam.native-preview" ]; then
                    echo "Unexpected extension identity: $extension" >&2
                    exit 1
                  fi
                  if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$version" = "0.0.0" ]; then
                    echo "Invalid extension version: $version" >&2
                    exit 1
                  fi
                  if ! [[ "$bundledTypeScriptVersion" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Invalid bundled TypeScript version: $bundledTypeScriptVersion" >&2
                    exit 1
                  fi
                  if [ "$signType" != "real" ]; then
                    echo "Refusing to publish artifacts signed with signType=$signType." >&2
                    exit 1
                  fi
                  if [ "$sourceRef" != "$RELEASE_SOURCE_BRANCH" ]; then
                    echo "Artifact source ref $sourceRef does not match triggering build ref $RELEASE_SOURCE_BRANCH." >&2
                    exit 1
                  fi
                  if [ "$sourceCommit" != "$RELEASE_SOURCE_COMMIT" ]; then
                    echo "Artifact source commit $sourceCommit does not match triggering build commit $RELEASE_SOURCE_COMMIT." >&2
                    exit 1
                  fi
                  case "$sourceRef" in
                    refs/tags/vscode-typescript/v"$version") ;;
                    *)
                      echo "Source ref $sourceRef does not match extension version $version." >&2
                      exit 1
                      ;;
                  esac

                  while IFS=$'\t' read -r filename expectedHash; do
                    artifact="$artifactDirectory/$filename"
                    test -f "$artifact"
                    actualHash="$(sha256sum "$artifact" | cut -d' ' -f1)"
                    if [ "$actualHash" != "$expectedHash" ]; then
                      echo "Hash mismatch for $filename." >&2
                      exit 1
                    fi
                  done < <(jq -r '.artifacts | to_entries[] | [.key, .value.sha256] | @tsv' "$manifest")

                  shopt -s nullglob
                  vsixFiles=("$artifactDirectory"/*.vsix)
                  if (( ${#vsixFiles[@]} == 0 )); then
                    echo "No VSIX artifacts found." >&2
                    exit 1
                  fi
                  for vsixFilePath in "${vsixFiles[@]}"; do
                    manifestFile="${vsixFilePath%.vsix}.manifest"
                    signatureFile="${vsixFilePath%.vsix}.signature.p7s"
                    for artifact in "$vsixFilePath" "$manifestFile" "$signatureFile"; do
                      filename="$(basename "$artifact")"
                      jq -e --arg filename "$filename" '.artifacts | has($filename)' "$manifest" >/dev/null
                    done
                    if cmp -s "$manifestFile" "$signatureFile"; then
                      echo "$signatureFile does not contain a real signature." >&2
                      exit 1
                    fi
                    openssl pkcs7 -inform DER -in "$signatureFile" -noout

                    packageVersion="$(unzip -p "$vsixFilePath" extension/package.json | jq -r '.version')"
                    packageBundledTypeScriptVersion="$(unzip -p "$vsixFilePath" extension/package.json | jq -r '.bundledTypeScriptVersion')"
                    if [ "$packageVersion" != "$version" ] || [ "$packageBundledTypeScriptVersion" != "$bundledTypeScriptVersion" ]; then
                      echo "Version metadata mismatch in $(basename "$vsixFilePath")." >&2
                      exit 1
                    fi
                  done
                  targetCount="$(jq '.targets | length' "$manifest")"
                  if [ "${#vsixFiles[@]}" -ne "$targetCount" ]; then
                    echo "Expected $targetCount VSIXs, found ${#vsixFiles[@]}." >&2
                    exit 1
                  fi
                displayName: Validate signed release artifacts
                env:
                  RELEASE_SOURCE_BRANCH: $(resources.pipeline.VSCode_TypeScript_Release_Build.sourceBranch)
                  RELEASE_SOURCE_COMMIT: $(resources.pipeline.VSCode_TypeScript_Release_Build.sourceCommit)

              - task: NodeTool@0
                inputs:
                  versionSpec: 24.x
                displayName: Install Node

              - bash: |
                  cat > .npmrc << 'EOF'
                  registry=https://pkgs.dev.azure.com/devdiv/devdiv/_packaging/devdiv_PublicPackages/npm/registry/
                  EOF
                  npm init -y
                displayName: Set up npm

              - task: npmAuthenticate@0
                inputs:
                  workingFile: .npmrc
                displayName: Authenticate npm

              - bash: npm install @vscode/vsce@3.9.2
                displayName: Install vsce

              - task: AzureCLI@2
                displayName: Check Marketplace authentication
                inputs:
                  azureSubscription: TypeScript-VSMarketplacePublishAuth
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail
                    az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798
                    npx vsce verify-pat TypeScriptTeam --azure-credential

              - ${{ if eq(parameters.dryRun, false) }}:
                  - task: AzureCLI@2
                    displayName: Publish VSIXs to Marketplace
                    retryCountOnTaskFailure: 3
                    inputs:
                      azureSubscription: TypeScript-VSMarketplacePublishAuth
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: |
                        set -euo pipefail
                        shopt -s nullglob
                        for vsixFilePath in "$(Pipeline.Workspace)"/vsix/*.vsix; do
                          manifestFilePath="${vsixFilePath%.vsix}.manifest"
                          signatureFilePath="${vsixFilePath%.vsix}.signature.p7s"
                          npx vsce publish \
                            --packagePath "$vsixFilePath" \
                            --manifestPath "$manifestFilePath" \
                            --signaturePath "$signatureFilePath" \
                            --azure-credential \
                            --skip-duplicate \
                            --allow-all-proposed-apis
                        done

                  - template: /tools/pipelines/steps/create-github-app-token.yml@self
                    parameters:
                      repositories: TypeScript
                      permissions: contents:write
                      insertSteps:
                        - bash: |
                            set -euo pipefail
                            artifactDirectory="$(Pipeline.Workspace)/vsix"
                            manifest="$artifactDirectory/release-manifest.json"
                            version="$(jq -r '.extensionVersion' "$manifest")"
                            bundledTypeScriptVersion="$(jq -r '.bundledTypeScriptVersion' "$manifest")"
                            sourceCommit="$(jq -r '.sourceCommit' "$manifest")"
                            tag="vscode-typescript/v$version"

                            shopt -s nullglob
                            vsixFiles=("$artifactDirectory"/*.vsix)
                            if (( ${#vsixFiles[@]} == 0 )); then
                              echo "No VSIX artifacts found." >&2
                              exit 1
                            fi

                            if gh release view "$tag" --repo microsoft/TypeScript >/dev/null 2>&1; then
                              gh release upload "$tag" "${vsixFiles[@]}" \
                                --repo microsoft/TypeScript \
                                --clobber
                            else
                              gh release create "$tag" "${vsixFiles[@]}" \
                                --repo microsoft/TypeScript \
                                --title "$tag" \
                                --latest=false \
                                --notes "Bundles TypeScript $bundledTypeScriptVersion from commit $sourceCommit."
                            fi
                          displayName: Create GitHub Release
                          env:
                            GH_TOKEN: $(GH_TOKEN)
